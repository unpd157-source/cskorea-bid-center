name: 나라장터 수집 및 배포
on:
  push:
    branches: [main]
  schedule:
    - cron: "10 9,16 * * 1-5"
      timezone: "Asia/Seoul"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 코드 검사
        run: |
          python3 -m unittest discover -s tests -v
          node --check public/app.js
      - name: 나라장터 공고 수집
        id: collect
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
        run: python3 -m collector.collect --output public/data/bids.json --previous public/data/bids.json --status public/data/status.json
      - name: 갱신 데이터 및 수집 상태 저장
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/bids.json public/data/status.json
          if ! git diff --cached --quiet; then
            git commit -m "data: 공고 및 수집 상태 갱신 [skip ci]"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
    outputs:
      collection_failed: ${{ steps.collect.outcome == 'failure' }}
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
      - name: 수집 실패 기록
        if: needs.build.outputs.collection_failed == 'true'
        run: |
          echo "::error::수집 실패 상태를 게시했습니다. 이전 공고 자료는 보존했습니다."
          exit 1
