<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#092c4c">
  <title>CS KOREA 입찰공고 센터</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-wrap">
      <div class="logo" aria-hidden="true">CS</div>
      <div>
        <p class="eyebrow">CS KOREA</p>
        <h1>입찰공고 센터</h1>
      </div>
    </div>
    <div class="sync" aria-label="데이터 수집 상태">
      <span class="sync-dot"></span>
      <span id="syncText">데이터 확인 중</span>
    </div>
  </header>

  <main>
    <section class="intro" aria-labelledby="pageTitle">
      <div>
        <p class="kicker">놓치면 안 되는 공고만 한곳에</p>
        <h2 id="pageTitle">오늘 확인할 입찰공고</h2>
        <p class="description">울산시·구군·교육청과 전국의 교육·행사 관련 공고입니다.</p>
      </div>
      <div class="today-box">
        <span>오늘</span>
        <strong id="todayText">-</strong>
      </div>
    </section>

    <nav class="filters" aria-label="입찰공고 필터">
      <button class="filter active" data-group="all" aria-pressed="true">
        <span>전체</span><strong id="count-all">0</strong>
      </button>
      <button class="filter today-filter" data-group="today" aria-pressed="false">
        <span>오늘 신규</span><strong id="count-today">0</strong>
      </button>
      <button class="filter" data-group="ulsan_city" aria-pressed="false">
        <span>울산시</span><strong id="count-ulsan_city">0</strong>
      </button>
      <button class="filter" data-group="ulsan_districts" aria-pressed="false">
        <span>5개 구·군</span><strong id="count-ulsan_districts">0</strong>
      </button>
      <button class="filter" data-group="ulsan_education" aria-pressed="false">
        <span>교육청</span><strong id="count-ulsan_education">0</strong>
      </button>
      <button class="filter" data-group="nationwide" aria-pressed="false">
        <span>전국</span><strong id="count-nationwide">0</strong>
      </button>
    </nav>

    <section class="result-head" aria-live="polite">
      <div>
        <span id="currentLabel">전체 공고</span>
        <strong><span id="visibleCount">0</span>건</strong>
      </div>
      <span class="mock-badge" id="sourceBadge">불러오는 중</span>
    </section>

    <section id="noticeList" class="notice-list" aria-label="입찰공고 목록"></section>

    <section id="emptyState" class="empty" hidden>
      <div class="empty-icon">✓</div>
      <h3>현재 확인할 공고가 없습니다</h3>
      <p>다음 자동 수집 때 새 공고를 다시 확인합니다.</p>
    </section>

    <section id="errorState" class="empty error" hidden>
      <div class="empty-icon">!</div>
      <h3>공고 데이터를 불러오지 못했습니다</h3>
      <p>잠시 후 페이지를 새로고침해 주세요.</p>
    </section>
  </main>

  <footer>
    <strong>CS KOREA</strong>
    <span>나라장터 공개 입찰정보를 정리해 보여주는 사내용 화면입니다.</span>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
